:root{--bg:#000;--card:#17171a;--c2:#222226;--tx:#f4f1ec;--mu:#a3a3ac;--ac:#ff4a00;--ac2:#a62d00;--bd:#34343a;--ok:#ffb020;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "KLeagueBasic","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;min-height:100vh;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.wrap{max-width:920px;margin:auto;padding:0 16px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:14px}
.role{color:var(--mu);font-size:13px}
h1{font:400 clamp(30px,8.4vw,54px)/1.05 "KLeagueDynamic","Noto Sans KR",sans-serif;margin:14px 0 20px;letter-spacing:-.01em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:12px 2px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font:inherit;cursor:pointer;transition:color .2s,border-color .2s}
nav button.on{color:var(--tx);border-color:var(--ac);font-weight:700}
main{padding-top:18px;padding-bottom:96px}
.card,.btn{--c:10px;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.card{background:var(--card);padding:16px 16px 16px 20px;margin-bottom:14px;box-shadow:inset 3px 0 0 var(--ac)}
.card h3,.gl{font:400 18px "KLeagueDynamic","Noto Sans KR",sans-serif;margin:0 0 10px}
.gh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}.gh .gl{font-size:30px;margin:0;color:var(--ac)}
.muted{color:var(--mu);font-size:13px}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--c2);border:0;border-bottom:2px solid var(--bd);padding:9px 10px;border-radius:0}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
.btn{--c:7px;background:var(--ac);color:#fff;border:0;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin:8px 8px 0 0;transition:background .15s,transform .1s}
.btn:hover{background:#ff6428}.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--ok)}
.btn.s{background:var(--c2);color:var(--tx)}.btn.s:hover{background:#2e2e34}
.btn.sm{padding:5px 11px;font-size:13px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row label{color:var(--mu);font-size:13px}.row input{flex:1;min-width:0}.row select{width:90px}
.sub{display:flex;gap:6px;margin-bottom:14px}
.sub button{flex:1;padding:10px;border:0;border-bottom:2px solid var(--bd);background:var(--card);color:var(--mu);font:inherit;cursor:pointer;transition:all .2s}
.sub button.on{color:var(--tx);border-color:var(--ac);background:var(--c2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.grid .card{margin:0;background:var(--c2)}
.chip{display:inline-flex;align-items:center;background:var(--bg);padding:3px 10px;margin:3px 5px 0 0}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:17px;padding:0 0 0 6px;line-height:1}.x:hover{color:var(--ac)}
ol{margin:6px 0;padding-left:24px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:400}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--ac)}tr.q td{background:rgba(255,74,0,.09)}
.m{display:grid;grid-template-columns:1fr 54px 12px 54px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.m .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m .n:last-child{text-align:right}
.sc{text-align:center;font:18px "KLeagueDynamic",sans-serif;padding:6px 0}
.sv{display:block;text-align:center;font:18px "KLeagueDynamic",sans-serif}
.dirty .sc{border-color:var(--ok)}
.pg{height:8px;background:var(--bd);margin-top:8px}.pg i{display:block;height:100%;background:var(--ac);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rounds{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}.rd{min-width:200px}
.rd h4{margin:0 0 8px;font:400 14px "KLeagueDynamic",sans-serif;color:var(--mu)}
.bm{background:var(--c2);padding:6px 10px;margin-bottom:10px;border-left:3px solid var(--bd)}
.bm .t{display:flex;align-items:center;gap:8px;padding:3px 0}.bm .t span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .t input{width:50px}.bm .t .sv{width:36px}
.bm .w span{font-weight:700;color:var(--ok)}
.champ{font:400 22px "KLeagueDynamic",sans-serif;color:var(--ok);padding:10px 0 0}
.rd i{font-style:normal;color:var(--mu)}
.stage{text-align:center;padding:22px 16px}
.who{font:400 clamp(34px,11vw,68px)/1.1 "KLeagueDynamic","Noto Sans KR",sans-serif;margin:8px 0;overflow-wrap:anywhere}
.who.in{animation:drop .5s cubic-bezier(.2,.9,.3,1.2) both}
.to{font:400 clamp(26px,8vw,44px)/1.1 "KLeagueDynamic","Noto Sans KR",sans-serif;color:var(--ac);min-height:1.2em;margin-bottom:10px}
.to.set{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.8)}to{opacity:1;transform:none}}
@keyframes flash{from{background:#6a2d10}to{background:var(--c2)}}
.grid .card.hl{animation:flash 1s ease-out}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:9;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--c2);border-top:3px solid var(--ok);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#bar.on{transform:none}#bar div{max-width:920px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}#bar .btn{margin:0}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);opacity:0;background:var(--tx);color:#000;padding:9px 16px;font-weight:700;transition:all .25s;pointer-events:none;z-index:10;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes rt{from{opacity:0;transform:translate(180px,-130px)}to{opacity:1;transform:none}}
@keyframes rl{from{opacity:0;transform:translate(-180px,130px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rt{animation:rt 1s cubic-bezier(.2,.8,.2,1) both}.rl{animation:rl 1s cubic-bezier(.2,.8,.2,1) .12s both}
.rev{animation:up .7s cubic-bezier(.2,.8,.2,1) .4s both}
.pane{animation:fade .24s ease both}.pop{animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* 단독 실행용 저장소: GitHub 저장소의 JSON 파일에 저장합니다. GitHub 설정이 없으면 이 브라우저(localStorage)에 저장합니다.
   GitHub Pages가 아닌 곳에 올릴 때는 아래 GH_DEFAULT에 소유자/저장소를 적어 두면 방문자도 같은 데이터를 읽습니다. 토큰은 절대 여기에 적지 마세요. */
const GH_DEFAULT={owner:'',repo:'',branch:'main',path:'data/state.json'};
(function(){
 const L=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
 const W=(k,v)=>{try{v==null||v===''?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
 function cfg(){let c=null;try{c=JSON.parse(L('hbc_gh')||'null')}catch(e){}
  if(c&&c.owner&&c.repo)return {branch:'main',path:'data/state.json',...c};
  if(GH_DEFAULT.owner&&GH_DEFAULT.repo)return {...GH_DEFAULT};
  const h=location.hostname;if(/\.github\.io$/.test(h)){const r=location.pathname.split('/')[1];if(r)return {owner:h.split('.')[0],repo:r,branch:'main',path:'data/state.json'}}
  return null}
 const tok=()=>L('hbc_tok')||'';
 const url=(c,q)=>'https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/')+(q||'');
 const hdr=(raw,x)=>{const h={Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json',...x};if(tok())h.Authorization='Bearer '+tok();return h};
 const b64=s=>{let x='';new TextEncoder().encode(s).forEach(v=>x+=String.fromCharCode(v));return btoa(x)};
 const bcs=window.BroadcastChannel?new BroadcastChannel('hbc-state'):null;
 let cbs=[],etag=null,sha=null,busy=0,last=null,pulled=false,timer=null,chain=Promise.resolve(),info={ok:null,msg:''};
 const emit=t=>{last=t;const sn={exists:t!=null,data:()=>JSON.parse(t)};cbs.forEach(c=>c(sn))};
 async function pull(){const c=cfg();if(!c||busy)return;
  try{const r=await fetch(url(c,'?ref='+encodeURIComponent(c.branch)),{headers:hdr(true,etag?{'If-None-Match':etag}:{}),cache:'no-store'});
   if(r.status===304)return;
   if(r.status===404){etag=null;sha=null;if(!pulled){pulled=true;emit(null)}return}
   if(!r.ok){info={ok:false,msg:'읽기 실패 ('+r.status+')'};return}
   etag=r.headers.get('ETag');const t=await r.text();pulled=true;info={ok:true,msg:''};
   if(!busy&&t!==last)emit(t)}
  catch(e){info={ok:false,msg:'네트워크 오류'}}}
 async function put(d){const c=cfg();if(!c)throw new Error('GitHub 설정 필요');if(!tok())throw new Error('토큰 필요');
  const t=JSON.stringify(d,null,1);
  for(let n=0;n<3;n++){
   if(!sha){const g=await fetch(url(c,'?ref='+encodeURIComponent(c.branch)),{headers:hdr(false),cache:'no-store'});
    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('읽기 실패 ('+g.status+')')}
   const r=await fetch(url(c),{method:'PUT',headers:hdr(false,{'Content-Type':'application/json'}),
    body:JSON.stringify({message:'대회 데이터 업데이트',content:b64(t),branch:c.branch,...(sha?{sha}:{})})});
   if(r.ok){sha=(await r.json()).content.sha;etag=null;return t}
   if(r.status===409||r.status===422){sha=null;continue}
   throw new Error('쓰기 실패 ('+r.status+')')}
  throw new Error('충돌이 계속되어 저장하지 못했습니다')}
 function start(){if(cfg()&&!timer){pull();timer=setInterval(()=>{if(!document.hidden)pull()},15000)}}
 const doc=()=>({
  set:d=>{busy++;const run=chain.then(async()=>{
    if(!cfg()){const t=JSON.stringify(d);W('hbc_state',t);return t}
    try{const t=await put(d);info={ok:true,msg:'저장됨'};return t}catch(e){info={ok:false,msg:e.message};throw e}});
   chain=run.catch(()=>{});
   return run.then(t=>{busy--;try{if(bcs)bcs.postMessage(t)}catch(x){}if(!busy)emit(t)},e=>{busy--;throw e})},
  onSnapshot:cb=>{cbs.push(cb);
   if(cfg())start();else setTimeout(()=>emit(L('hbc_state')),0)}});
 window.GH={cfg,start,info:()=>info,hasTok:()=>!!tok(),
  verifyTok:async t=>{try{const r=await fetch('https://api.github.com/user',{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t},cache:'no-store'});return r.ok}catch(e){return false}},
  setCfg:o=>{W('hbc_gh',o?JSON.stringify(o):null);etag=null;sha=null;pulled=false},
  setTok:t=>W('hbc_tok',t)};
 window.claude={use:async()=>({doc})};
})();
</script>
<script>
const S={tab:'draw',sub:'league',mode:'p',edit:false,players:[],order:[],groups:[],gn:4,adv:2,tourRoundCount:0,sc:{},bt:{},seasonId:'season-'+Date.now().toString(36),winners:[],rounds:1,adjustments:{}};
let admin=false,ref=null,net='',showLogin=false,lerr='',fresh=false,arm='',D={},last='',tt;
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uid=()=>'g'+Math.random().toString(36).slice(2,7);
const gname=i=>String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):'');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
const save=()=>{if(!admin||!ref)return Promise.resolve(false);
 return ref.set({players:S.players,order:S.order,gn:S.gn,adv:S.adv,rounds:S.rounds,tourRoundCount:S.tourRoundCount,adjustments:S.adjustments,seasonId:S.seasonId,winners:S.winners,bt:Object.entries(S.bt).map(([k,v])=>({k,v})),groups:S.groups.map(g=>({id:g.id,m:g.m})),sc:Object.entries(S.sc).map(([k,v])=>({k,v}))}).then(()=>true).catch(()=>{net=' · GitHub 저장에 실패했습니다 · 저장소와 토큰을 확인하세요';render();return false})};
function apply(d){['players','order','gn','adv','rounds','tourRoundCount','adjustments','seasonId','winners'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});if(!S.seasonId)S.seasonId='season-'+Date.now().toString(36);if(!Array.isArray(S.winners))S.winners=[];if(!Number.isInteger(+S.rounds)||+S.rounds<1)S.rounds=1;S.rounds=Math.min(6,+S.rounds);if(!Number.isInteger(+S.tourRoundCount)||+S.tourRoundCount<0)S.tourRoundCount=0;S.tourRoundCount=Math.min(10,+S.tourRoundCount);if(!S.adjustments||typeof S.adjustments!=='object')S.adjustments={};
 S.groups=(d.groups||[]).map((x,i)=>({id:x.id||'g'+i,m:x.m||[]}));
 S.bt=Array.isArray(d.bt)?Object.fromEntries(d.bt.map(e=>[e.k,e.v])):{};
 S.sc=Array.isArray(d.sc)?Object.fromEntries(d.sc.map(e=>[e.k,e.v])):{}}
async function init(){
 try{admin=sessionStorage.getItem('adm')==='1'}catch(e){}
 try{
  const db=await claude.use('db');
  if(db){ref=db.doc('tournament/state');
   const tm=setTimeout(()=>{net=' · 데이터를 불러오는 중이거나 연결할 수 없습니다';render()},10000);
   ref.onSnapshot(sn=>{clearTimeout(tm);net='';if(sn.exists&&!drawing)apply(sn.data());render()},e=>{clearTimeout(tm);net=' · 데이터를 불러오지 못했습니다';render()})}
  else net=' · 로그인 후 대회 현황을 볼 수 있습니다';
 }catch(e){}
 render()}
const HASH='6a6ef905ee6e892d81c1e8d94ebdeeb5785fcfa54c3be07bebd78d38c8f53f3d';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function doLogin(){const id=$('lid').value.trim(),pw=$('lpw').value,typedTok=$('lgt')?.value.trim()||'';
 try{
  if(await sha('hbc:'+id+':'+pw)!==HASH){lerr='아이디 또는 비밀번호가 맞지 않습니다';render();return}
  const token=typedTok|| (GH.hasTok()?'__SAVED__':'');
  if(!token){lerr='관리자 인증용 GitHub 토큰을 입력해 주세요';render();return}
  if(typedTok){const valid=await GH.verifyTok(typedTok);if(!valid){lerr='GitHub 토큰이 유효하지 않습니다. 토큰을 확인해 주세요';render();return}GH.setTok(typedTok)}
  else { /* 이미 저장된 토큰은 그대로 사용 */ }
  admin=true;showLogin=false;lerr='';try{sessionStorage.setItem('adm','1')}catch(e){}
 }catch(e){lerr='로그인 처리 중 오류가 발생했습니다'}
 render()}
function toggleLogin(){if(admin){admin=false;S.edit=false;D={};try{sessionStorage.removeItem('adm')}catch(e){}}else{showLogin=!showLogin;lerr=''}render()}
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;render()}};
function parse(v){S.players=v.split('\n').map(s=>s.trim()).filter(Boolean);save()}

/* 편성 수정 */
function rmPlayer(gi,pi){const n=S.groups[gi].m.splice(pi,1)[0];S.players=S.players.filter(p=>p!==n);S.order=S.order.filter(p=>p!==n);S.bt={};save();render();toast(n+' 삭제됨')}
function addPlayer(gi){const el=$('ap'+gi),n=el.value.trim();if(!n)return;if(S.players.includes(n)){toast('이미 등록된 이름입니다');return}
 S.groups[gi].m.push(n);S.players.push(n);S.bt={};save();render();toast(n+' 추가됨')}
function rmGroup(gi){if(arm!=='g'+gi){arm='g'+gi;render();setTimeout(()=>{if(arm==='g'+gi){arm='';render()}},3000);return}
 S.groups.splice(gi,1);arm='';S.bt={};save();render();toast('조를 삭제했습니다. 인원은 참가자 명단에 남아 있습니다')}
function addGroup(){S.groups.push({id:uid(),m:[]});S.bt={};save();render()}

/* 추첨: 참가자를 한 명씩 보여주고 조에 배치 */
let drawing=false,skip=false,DR={};
const sleep=ms=>skip?Promise.resolve():new Promise(r=>setTimeout(r,ms));
function skipDraw(){skip=true}
async function drawGroups(){
 if(drawing)return;
 if(S.players.length<2){toast('참가자를 2명 이상 입력하세요');return}
 const n=Math.min(S.gn,S.players.length),ps=shuf(S.players),plan=[];
 for(let r=0;r*n<ps.length;r++){const perm=shuf([...Array(n).keys()]);ps.slice(r*n,r*n+n).forEach((p,i)=>plan.push([p,perm[i]]))}
 drawing=true;skip=false;S.edit=false;
 S.groups=Array.from({length:n},()=>({id:uid(),m:[]}));S.sc={};S.bt={};S.adjustments={};S.order=[];D={};
 for(let i=0;i<plan.length;i++){const [p,gi]=plan[i];
  DR={on:true,name:p,gi:-1,pop:'',k:i+1,t:plan.length};render();await sleep(750);
  for(let f=0;f<8&&!skip;f++){const el=$('to');if(el)el.textContent=gname(Math.floor(Math.random()*n))+'조';await sleep(70)}
  S.groups[gi].m.push(p);DR={on:true,name:p,gi,pop:gi+':'+(S.groups[gi].m.length-1),k:i+1,t:plan.length};render();await sleep(700)}
 DR={};drawing=false;render();
 save().then(ok=>toast(ok?'조 추첨을 마쳤습니다':'GitHub 저장에 실패해 이 화면에만 반영됐습니다'))}

const gcard=(g,gi,ed)=>`<div class="card${DR.on&&DR.gi===gi?' hl':''}"><div class="gh"><span class="gl">${gname(gi)}</span><span class="muted">${g.m.length}명</span>${ed?`<button class="btn s sm" style="margin-left:auto" onclick="rmGroup(${gi})">${arm==='g'+gi?'한 번 더 누르면 삭제':'조 삭제'}</button>`:''}</div>
<div>${g.m.map((p,pi)=>`<span class="chip${DR.pop===gi+':'+pi?' pop':''}">${esc(p)}${ed?`<button class="x" aria-label="${esc(p)} 삭제" onclick="rmPlayer(${gi},${pi})">×</button>`:''}</span>`).join('')||'<span class="muted">인원이 없습니다</span>'}</div>
${ed?`<div class="row" style="margin-top:12px"><input id="ap${gi}" placeholder="추가할 이름" aria-label="추가할 이름" onkeydown="if(event.key==='Enter')addPlayer(${gi})"><button class="btn sm" onclick="addPlayer(${gi})">인원 추가</button></div>`:''}</div>`;
function viewGroups(){
 return S.groups.length?`<div class="grid">${S.groups.map((g,i)=>gcard(g,i,false)).join('')}</div>`:'<div class="card muted">아직 조추첨이 진행되지 않았습니다.</div>'}
function drawTab0(){
 const grid=`<div class="grid">${S.groups.map((g,i)=>gcard(g,i,S.edit&&!drawing)).join('')}</div>`;
 if(drawing)return `<div class="card stage"><div class="muted">${DR.k} / ${DR.t}</div><div class="who${DR.gi<0?' in':''}">${esc(DR.name)}</div><div id="to" class="to${DR.gi>=0?' set':''}">${DR.gi>=0?gname(DR.gi)+'조':'…'}</div><button class="btn s sm" onclick="skipDraw()">건너뛰기</button></div>`+grid;
 return `<div class="card"><h3>참가자 명단 <span class="muted">${S.players.length}명</span></h3><label class="muted" for="pl">한 줄에 한 명씩 입력</label><textarea id="pl" onchange="parse(this.value);render()">${esc(S.players.join('\n'))}</textarea></div>
 <div class="card"><h3>조 추첨</h3><div class="row"><label for="gn">조 개수</label><input id="gn" type="number" min="1" max="26" value="${S.gn}" style="max-width:90px;flex:none" onchange="S.gn=Math.max(1,+this.value||1);save()"></div>
 <button class="btn" onclick="drawGroups()">조 추첨하기</button><button class="btn s" onclick="addGroup()">빈 조 추가</button><button class="btn s" onclick="S.edit=!S.edit;render()">${S.edit?'수정 끝내기':'조 편성 수정'}</button>
 <p class="muted" style="margin:10px 0 0">참가자를 한 명씩 뽑아 조에 배치합니다. 다시 추첨하면 조별리그 점수가 초기화됩니다.</p></div>`+grid}

/* 조별리그 */
const mk=(g,i,j,r=1)=>g.id+'|'+g.m[i]+'|'+g.m[j]+(r>1?'|r'+r:'');
function matches(g){const m=[];for(let r=1;r<=S.rounds;r++)for(let i=0;i<g.m.length;i++)for(let j=i+1;j<g.m.length;j++)m.push([i,j,r]);return m}
const done=s=>s&&s[0]!==''&&s[1]!==''&&s[0]!==undefined&&s[1]!==undefined;
function standings(gi){const g=S.groups[gi],t=g.m.map(n=>({n,p:0,w:0,d:0,l:0,gf:0,ga:0}));
 matches(g).forEach(([i,j,r])=>{const s=S.sc[mk(g,i,j,r)];if(!done(s))return;const a=+s[0],b=+s[1];
  t[i].gf+=a;t[i].ga+=b;t[j].gf+=b;t[j].ga+=a;
  if(a>b){t[i].w++;t[i].p+=3;t[j].l++}else if(a<b){t[j].w++;t[j].p+=3;t[i].l++}else{t[i].d++;t[j].d++;t[i].p++;t[j].p++}});
 t.forEach(x=>{const z=(S.adjustments[g.id]||{})[x.n]||{};x.penalty=Math.max(0,+z.penalty||0);x.advantage=Math.max(0,+z.advantage||0);x.p+=x.advantage-x.penalty}); return t.sort((x,y)=>y.p-x.p||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf)}
const val=(t,k,x)=>((D[t+':'+k]||S[t][k]||[])[x]??'');
const sv=(t,k,x)=>admin?`<input class="sc" type="number" min="0" inputmode="numeric" aria-label="점수" data-k="${esc(k)}" value="${esc(val(t,k,x))}" oninput="dr('${t}',this,${x})">`:`<b class="sv">${val(t,k,x)===''||val(t,k,x)===undefined?'-':esc(val(t,k,x))}</b>`;
function dr(t,el,x){const k=el.dataset.k,id=t+':'+k,cur=D[id]||[...(S[t][k]||[]),'','','',''].slice(0,4);cur[x]=el.value;D[id]=cur;el.closest('.m,.bm').classList.add('dirty');bar()}
function commit(){Object.entries(D).forEach(([id,v])=>{const i=id.indexOf(':');S[id.slice(0,i)][id.slice(i+1)]=v});D={};
 save().then(ok=>toast(ok?'점수를 저장했습니다':'GitHub 저장에 실패해 이 화면에만 반영됐습니다'));render()}
function bar(){const n=Object.keys(D).length,b=$('bar');
 if(admin&&n){b.innerHTML=`<div><span>저장하지 않은 점수 ${n}건</span><button class="btn" onclick="commit()">점수 저장</button></div>`;b.classList.add('on')}else b.classList.remove('on')}
function changeRounds(delta){if(!admin)return;const next=Math.max(1,Math.min(6,S.rounds+delta));if(next===S.rounds)return;if(next<S.rounds){for(const g of S.groups)for(let r=next+1;r<=S.rounds;r++)for(let i=0;i<g.m.length;i++)for(let j=i+1;j<g.m.length;j++)delete S.sc[mk(g,i,j,r)];}S.rounds=next;D={};save().then(ok=>toast(ok?'라운드 설정을 저장했습니다':'저장에 실패했습니다'));render()}
function setRounds(v){if(!admin)return;const n=Math.max(1,Math.min(6,parseInt(v,10)||1));changeRounds(n-S.rounds)}
function adjustPoint(gi,name,type,delta){if(!admin)return;const g=S.groups[gi];if(!g)return;S.adjustments[g.id]=S.adjustments[g.id]||{};const z=S.adjustments[g.id][name]||(S.adjustments[g.id][name]={penalty:0,advantage:0});z[type]=Math.max(0,(+z[type]||0)+delta);save().then(ok=>toast(ok?'승점 조정을 저장했습니다':'저장에 실패했습니다'));render()}
function leagueTab(){
 if(!S.groups.length)return `<div class="card muted">${admin?'먼저 조추첨 탭에서 조를 추첨하세요.':'아직 조 편성이 진행되지 않았습니다.'}</div>`;
 const controls=admin?`<div class="card"><div class="row" style="justify-content:space-between"><b>조별리그 라운드 설정</b><span class="muted">현재 ${S.rounds}라운드</span></div><div class="row" style="align-items:center"><button class="btn s" onclick="changeRounds(-1)" ${S.rounds<=1?'disabled':''}>− 라운드 감소</button><button class="btn" onclick="changeRounds(1)" ${S.rounds>=6?'disabled':''}>＋ 라운드 추가</button><label class="muted" for="roundCount">직접 설정</label><input id="roundCount" type="number" min="1" max="6" value="${S.rounds}" style="max-width:78px" onchange="setRounds(this.value)"></div><p class="muted" style="margin:8px 0 0">라운드 수를 줄이면 삭제되는 라운드의 경기 점수도 함께 삭제됩니다.</p></div>`:`<div class="card muted">조별리그 ${S.rounds}라운드 진행</div>`;
 return controls+S.groups.map((g,gi)=>{const st=standings(gi),ms=matches(g),d=ms.filter(([i,j,r])=>done(S.sc[mk(g,i,j,r)])).length;let prev=0;const fixtures=ms.map(([i,j,r])=>{const k=mk(g,i,j,r),label=r!==prev?`<div class="muted" style="font-weight:800;margin:12px 0 5px">${r}라운드</div>`:'';prev=r;return label+`<div class="m"><span class="n">${esc(g.m[i])}</span>${sv('sc',k,0)}<span style="text-align:center">:</span>${sv('sc',k,1)}<span class="n">${esc(g.m[j])}</span></div>`}).join('');

/* 토너먼트: 이름=참가자, ''=상대 미정, null=부전승 */
function winner(m,key){const [a,b]=m;
 if(a===''||b==='')return '';
 if(a===null&&b===null)return null;
 if(a===null)return b;if(b===null)return a;
 const s=S.bt[key];if(!done(s))return '';
 const x=+s[0],y=+s[1];if(x!==y)return x>y?a:b;
 const p=s[2],q=s[3];if(p===undefined||q===undefined||p===''||q==='')return '';
 return +p>+q?a:+p<+q?b:''}
function minTourRounds(count){let n=1,r=0;while(n<count){n*=2;r++}return Math.max(1,r)}
function changeTourRounds(delta){
 if(!admin)return;const B=bracket();if(!B||B.seeds.length<2){toast('토너먼트 진출자가 2명 이상 필요합니다');return}
 const min=minTourRounds(B.seeds.length),current=Math.max(min,+S.tourRoundCount||min),next=current+delta;
 if(next<min){toast('현재 진출 인원을 모두 수용하려면 최소 '+min+'라운드가 필요합니다');return}
 if(next>10){toast('토너먼트는 최대 10라운드까지 설정할 수 있습니다');return}
 if(next===current)return;
 if(!confirm('토너먼트 라운드를 변경하면 기존 토너먼트 경기 점수와 승부차기 점수가 모두 초기화됩니다. 계속할까요?'))return;
 S.tourRoundCount=next;S.bt={};D={};save().then(ok=>toast(ok?'토너먼트 라운드를 변경하고 저장했습니다':'저장에 실패했습니다'));render()
}
function setTourRounds(v){if(!admin)return;const B=bracket();if(!B)return;const min=minTourRounds(B.seeds.length),n=parseInt(v,10);if(!Number.isInteger(n)||n<min||n>10){toast('토너먼트 라운드는 '+min+'~10 사이로 입력하세요');render();return}changeTourRounds(n-Math.max(min,+S.tourRoundCount||min))}
function bracket(){
 if(!S.groups.length)return null;
 const sts=S.groups.map((_,i)=>standings(i)),seeds=[];
 for(let r=0;r<S.adv;r++){const row=sts.map(s=>s[r]&&s[r].n).filter(Boolean);seeds.push(...(r%2?row.reverse():row))}
 if(seeds.length<2)return {seeds,roundCount:minTourRounds(seeds.length)};
 const minRounds=minTourRounds(seeds.length),roundCount=Math.max(minRounds,+S.tourRoundCount||minRounds);let n=2**roundCount;const s=[...seeds];while(s.length<n)s.push(null);
 let cur=[];for(let i=0;i<n/2;i++)cur.push([s[i],s[n-1-i]]);
 const rounds=[];let rd=0;
 for(;;){const ms=cur.map((m,i)=>{const k=rd+'-'+i;return {a:m[0],b:m[1],k,w:winner(m,k)}});rounds.push(ms);
  if(ms.length===1)break;
  cur=[];for(let i=0;i<ms.length;i+=2)cur.push([ms[i].w,ms[i+1].w]);rd++}
 let third=null;
 if(rounds.length>=2){const sf=rounds[rounds.length-2];
  const lo=m=>m.w===''?'':(m.a===null||m.b===null)?null:(m.w===m.a?m.b:m.a);
  const a=lo(sf[0]),b=lo(sf[1]);third={a,b,k:'3rd',w:winner([a,b],'3rd')}}
 return {seeds,rounds,fin:rounds[rounds.length-1][0],third,roundCount}}
const slot=p=>p===''?'<i>대기</i>':p===null?'<i>부전승</i>':esc(p);
function pkRow(m){const s=S.bt[m.k];if(!s||!done(s)||+s[0]!==+s[1])return '';
 if(admin)return `<div class="t"><span class="muted">승부차기</span>${sv('bt',m.k,2)}${sv('bt',m.k,3)}</div>`;
 return s[2]!==undefined&&s[2]!==''&&s[3]!==undefined&&s[3]!==''?`<div class="t"><span class="muted">승부차기 ${esc(s[2])} : ${esc(s[3])}</span></div>`:''}
function mbox(m){const live=!!m.a&&!!m.b;
 const row=(p,x)=>`<div class="t${m.w&&m.w===p?' w':''}"><span>${slot(p)}</span>${live?sv('bt',m.k,x):''}</div>`;
 return `<div class="bm">${row(m.a,0)}${row(m.b,1)}${live?pkRow(m):''}</div>`}
function syncChampion(B){
 if(!admin||!B||!B.fin||!B.fin.w||typeof B.fin.w!=='string')return;

 S.winners.unshift(rec);save().then(ok=>{if(ok)toast(rec.name+' 우승 기록이 역대 우승자에 추가됐습니다')});
}

function winnersTab(){const rows=S.winners.map((w,i)=>`<div class="row" style="justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:center;gap:8px;min-width:0"><span class="muted" style="min-width:26px">${i+1}.</span><span class="muted" style="margin-right:4px">${w.year?esc(w.year)+'년':'연도 미입력'}</span><span style="font-weight:800;overflow-wrap:anywhere">${esc(w.name)}</span></div>${admin?`<div class="row" style="gap:5px;flex-shrink:0"><button class="btn s sm" onclick="moveWinner('${esc(w.id)}',-1)" ${i===0?'disabled':''} aria-label="위로 이동">↑</button><button class="btn s sm" onclick="moveWinner('${esc(w.id)}',1)" ${i===S.winners.length-1?'disabled':''} aria-label="아래로 이동">↓</button><button class="btn s sm" onclick="editWinner('${esc(w.id)}')">이름 수정</button><button class="btn s sm" onclick="deleteWinner('${esc(w.id)}')">${arm==='winner-'+w.id?'한 번 더 눌러 삭제':'삭제'}</button></div>`:''}</div>`).join('');return `<div class="card"><h3>역대 우승자</h3><p class="muted">대회 결승 결과가 확정되면 해당 연도의 우승자가 자동으로 기록됩니다. 관리자 모드에서는 이름과 표시 순서를 수정할 수 있습니다.</p>${admin?`<div class="row" style="margin:12px 0"><input id="winnerYear" type="number" min="1900" max="2100" value="${new Date().getFullYear()}" placeholder="연도" aria-label="우승 연도" style="max-width:110px"><input id="winnerName" placeholder="우승자 이름" aria-label="우승자 이름"><button class="btn" onclick="addWinner()">추가</button></div>`:''}${rows||'<div class="muted" style="padding:18px 0">아직 등록된 우승자가 없습니다.</div>'}</div>`}
function tourTab(){
 if(!S.groups.length)return `<div class="card muted">${admin?'먼저 조추첨과 조별리그를 진행하세요.':'아직 토너먼트가 시작되지 않았습니다.'}</div>`;

/* 득점왕: 저장된 조별리그·토너먼트 점수에서 자동 집계 */
function tourMatches(){const B=bracket();if(!B||!B.rounds)return [];const out=[];
 [...B.rounds.flat(),...(B.third?[B.third]:[])].forEach(m=>{if(m.a&&m.b)out.push({a:m.a,b:m.b,s:S.bt[m.k]})});return out}
function scorers(){
 const m={},get=n=>m[n]||(m[n]={n,l:0,t:0,p:0});
 S.groups.forEach(g=>g.m.forEach(n=>get(n)));
 S.groups.forEach(g=>matches(g).forEach(([i,j,r])=>{const s=S.sc[mk(g,i,j,r)];if(!done(s))return;const a=get(g.m[i]),b=get(g.m[j]);a.l+=+s[0];b.l+=+s[1];a.p++;b.p++}));
 tourMatches().forEach(x=>{if(!done(x.s))return;const a=get(x.a),b=get(x.b);a.t+=+x.s[0];b.t+=+x.s[1];a.p++;b.p++});
 return Object.values(m).map(r=>({...r,g:r.l+r.t})).sort((a,b)=>b.g-a.g||b.t-a.t||a.p-b.p||a.n.localeCompare(b.n))}

 <div class="row"><input id="ghr" placeholder="소유자/저장소 (예: myname/hellcup)" aria-label="저장소" value="${c?esc(c.owner+'/'+c.repo):''}"><input id="ghb" placeholder="브랜치" aria-label="브랜치" value="${c?esc(c.branch):'main'}" style="max-width:110px;flex:none"></div>
 <div class="row" style="margin-top:8px"><input id="ghp" placeholder="저장 파일 경로" aria-label="저장 파일 경로" value="${c?esc(c.path):'data/state.json'}"></div>
 <div class="row" style="margin-top:8px"><input id="ght" type="password" placeholder="${GH.hasTok()?'저장된 토큰 사용 중 · 변경할 때만 새 토큰 입력':'GitHub 토큰 (Contents 읽기/쓰기 권한)'}" aria-label="GitHub 토큰" autocomplete="new-password"></div>
 <p class="muted" style="margin:7px 0 0">${GH.hasTok()?'✓ 토큰 저장됨 · 다음 로그인부터 자동으로 사용됩니다':'토큰을 한 번 저장하면 다음부터 다시 입력할 필요가 없습니다.'}</p>
 <button class="btn" onclick="ghSave()">연결하고 저장 테스트</button><button class="btn s" onclick="ghOff()">연결 해제</button>
 <p class="muted" style="margin:10px 0 0">토큰은 이 브라우저의 로컬 저장소에 보관되며 GitHub 데이터 파일에는 포함되지 않습니다. 일반 참여자는 토큰 없이 읽기만 합니다.</p></div>`}
async function ghSave(){const v=$('ghr').value.trim().split('/');if(v.length!==2||!v[0]||!v[1]){toast('저장소를 소유자/저장소 형식으로 입력하세요');return}
 GH.setCfg({owner:v[0],repo:v[1],branch:$('ghb').value.trim()||'main',path:$('ghp').value.trim()||'data/state.json'});
 const t=$('ght').value.trim();if(t)GH.setTok(t);if(!GH.hasTok()){toast('GitHub 토큰을 처음 한 번 입력해 주세요');return}GH.start();
 const ok=await save();toast(ok?'GitHub에 저장했습니다':'GitHub 저장에 실패했습니다. 저장소와 토큰을 확인하세요');render()}
function ghOff(){GH.setCfg(null);GH.setTok('');toast('연결을 해제했습니다');render()}
function drawTab(){return drawTab0()+(admin&&!drawing?resetCard()+ghCard():'')}

function render(){
 if(!admin)S.tab='status';
 $('tabs').style.display=admin?'flex':'none';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
 $('role').textContent=(admin?'관리자 모드':'보기 전용')+net;
 $('lg').textContent=admin?'로그아웃':'관리자 로그인';
 const lp=$('lp'),open=showLogin&&!admin;
 if(lp.dataset.o!==String(open)){lp.dataset.o=String(open);
  lp.innerHTML=open?`<div class="card"><h3>관리자 로그인</h3><div class="row"><input id="lid" placeholder="아이디" aria-label="아이디" autocomplete="off" name="visitor-login-id"><input id="lpw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="off" name="visitor-login-password" onkeydown="if(event.key==='Enter')doLogin()"></div><div class="row" style="margin-top:8px"><input id="lgt" type="password" placeholder="${GH.hasTok()?'GitHub 토큰 저장됨 · 변경할 때만 새 토큰 입력':'GitHub 서버 토큰 (최초 1회 입력)'}" aria-label="GitHub 서버 토큰" autocomplete="new-password" onkeydown="if(event.key==='Enter')doLogin()"></div><p class="muted" style="margin:8px 0">${GH.hasTok()?'✓ 토큰이 이 브라우저에 저장되어 있습니다. 토큰 입력 없이 아이디와 비밀번호로 로그인할 수 있습니다.':'처음 한 번 토큰을 입력하면 이 브라우저에 저장되며, 다음부터는 아이디와 비밀번호만 입력하면 됩니다.'}</p><button class="btn" onclick="doLogin()">로그인</button><span class="muted" id="le"></span></div>`:''}
 if(open)$('le').textContent=lerr;
 const app=$('app');app.innerHTML=S.tab==='draw'?drawTab():statusTab();
 if(last!==S.tab+S.sub){app.classList.remove('pane');void app.offsetWidth;app.classList.add('pane');last=S.tab+S.sub}
 fresh=false;bar()}
render();init();
</script>
</body>
</html>
